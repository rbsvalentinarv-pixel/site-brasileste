# Brasileste - configuracao para Netlify (equivalente ao .htaccess da HostGator)
# HTTPS e compressao sao automaticos no Netlify.

[[headers]]
  for = "/pdfs/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
